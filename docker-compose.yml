services:
  db:
    image: postgres:16-alpine
    container_name: gurukul-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gurukul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gurukul_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gurukul_ai}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gurukul_pg:/var/lib/postgresql/data

volumes:
  gurukul_pg:
